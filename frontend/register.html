<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration - MediConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-link">
        <span>MediConnect</span>
        <span class="brand-badge">Healthcare</span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary">Existing User Login</a>
      </div>
    </div>
  </header>

  <!-- Register Form Box -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.5rem;">
    <div class="card" style="width: 100%; max-width: 520px; padding: 2.5rem; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2>Patient Registration</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Create your secure account to consult doctors and manage health records</p>
      </div>

      <div id="alert-container"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Jane Doe" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="jane@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="phone_number">Phone Number</label>
            <input type="tel" id="phone_number" class="form-control" placeholder="+1 (555) 000-0000" required />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="gender">Gender</label>
            <select id="gender" class="form-control" required>
              <option value="">Select Gender</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="date_of_birth">Date of Birth</label>
            <input type="date" id="date_of_birth" class="form-control" required />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="password">Password (min 6 chars)</label>
            <input type="password" id="password" class="form-control" minlength="6" placeholder="••••••••" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" class="form-control" minlength="6" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
          Create Patient Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
