<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - MediConnect Doctor Consultation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-link">
        <span>MediConnect</span>
        <span class="brand-badge">Healthcare</span>
      </a>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-secondary">New Patient Register</a>
      </div>
    </div>
  </header>

  <!-- Login Form Box -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2>Sign In to Portal</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Access your consultations, medical records, or admin panel</p>
      </div>

      <div id="alert-container"></div>

      <!-- Quick Demo Account Fill -->
      <div style="background: #f1f5f9; padding: 0.85rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.85rem;">
        <div style="font-weight: 600; color: var(--secondary); margin-bottom: 0.5rem;">Quick Demo Fill:</div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('patient')">Patient Demo</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('doctor')">Doctor Demo</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('admin')">Admin Demo</button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Role (Optional)</label>
          <select id="role" class="form-control">
            <option value="">Auto-Detect Role</option>
            <option value="patient">Patient</option>
            <option value="doctor">Doctor</option>
            <option value="admin">Administrator</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillDemo(role) {
      if (role === 'patient') {
        document.getElementById('email').value = 'john.doe@example.com';
        document.getElementById('password').value = 'Patient@123';
        document.getElementById('role').value = 'patient';
      } else if (role === 'doctor') {
        document.getElementById('email').value = 'dr.sarah@mediconnect.com';
        document.getElementById('password').value = 'Doctor@123';
        document.getElementById('role').value = 'doctor';
      } else if (role === 'admin') {
        document.getElementById('email').value = 'admin@mediconnect.com';
        document.getElementById('password').value = 'Admin@123';
        document.getElementById('role').value = 'admin';
      }
    }
  </script>
</body>
</html>
