
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'

  - script: |
      cd backend
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install Backend Dependencies'

  - script: |
      cd backend
      python -m compileall .
    displayName: 'Check Python Backend'
